<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Despedida TrikiVals</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="fuentes" rel="stylesheet" href="">
<style>
  :root { --acento: #e8c56b; --crema: #f4ecd8; --suave: #d8cfb8; --tenue: #bdb49f; --f-tit: 'Cinzel', serif; --f-txt: 'Cormorant Garamond', Georgia, serif; --esp: 6px; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--f-txt); color: var(--crema); }
  .escena { position: absolute; left: 0; top: 0; overflow: hidden; background: #05080a; transform-origin: top left; }
  .h { width: 1920px; height: 1080px; }
  .v { width: 1080px; height: 1920px; }

  .fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 55% 45%; animation: zoom 40s ease-in-out infinite alternate; }
  .quieto .fondo { animation: none; }
  @keyframes zoom { to { transform: scale(1.06); } }
  .velo { position: absolute; inset: 0; pointer-events: none; }
  .h .velo { background: linear-gradient(90deg, rgba(3,6,8,.55) 0%, rgba(3,6,8,.25) 45%, rgba(3,6,8,.82) 68%, rgba(3,6,8,.92) 100%), radial-gradient(ellipse 90% 80% at 40% 45%, transparent 40%, rgba(0,0,0,.75) 100%); }
  .v .velo { background: linear-gradient(180deg, rgba(3,6,8,.6) 0%, rgba(3,6,8,.2) 25%, rgba(3,6,8,.78) 45%, rgba(3,6,8,.9) 100%); }

  /* Barrera mágica */
  .barrera { position: absolute; pointer-events: none; mix-blend-mode: screen; }
  .barrera > * { position: absolute; inset: 0; }
  .barrera .brillo { border-radius: 50%; box-shadow: 0 0 60px 8px rgba(255,214,110,.55), inset 0 0 70px 10px rgba(255,214,110,.35); animation: pulso 4s ease-in-out infinite; }
  .barrera .gira { animation: gira 60s linear infinite; }
  .barrera .giraR { animation: gira 90s linear infinite reverse; }
  .barrera svg { width: 100%; height: 100%; }
  .chispa { position: absolute !important; inset: auto !important; border-radius: 50%; background: #fff2c0; box-shadow: 0 0 10px 3px rgba(255,214,110,.9); animation: sube linear infinite; }
  .quieto .barrera * { animation-play-state: paused; }
  @keyframes gira { to { transform: rotate(360deg); } }
  @keyframes pulso { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
  @keyframes sube { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-48%) scale(1.1); opacity: 0; } }

  /* Piezas comunes */
  .titulo { position: absolute; display: flex; align-items: center; gap: 22px; }
  .titulo .raya { height: 1px; background: linear-gradient(90deg, var(--acento), transparent); flex: 1; }
  .titulo .corta { width: 40px; height: 1px; background: var(--acento); }
  .titulo .txt { font-family: var(--f-tit); font-weight: 700; letter-spacing: var(--esp); white-space: nowrap; text-shadow: 0 2px 12px #000; }
  .sello { padding: 8px 20px; border: 1px solid var(--acento); background: rgba(5,8,10,.6); font-family: var(--f-tit); font-weight: 700; letter-spacing: 3px; color: var(--acento); white-space: nowrap; }

  .camara { position: absolute; padding: 10px; border: 1px solid var(--acento); box-shadow: 0 0 40px rgba(0,0,0,.8), 0 0 0 6px rgba(5,8,10,.55); }
  .camara .dentro { width: 100%; height: 100%; border: 1px solid rgba(244,236,216,.25); background: #030405; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #9b9483; text-align: center; }
  .camara .dentro b { font-family: var(--f-tit); font-size: 30px; letter-spacing: 4px; color: var(--suave); }
  .camara .dentro i { font-size: 24px; }
  .obs .camara .dentro { background: transparent; border-color: transparent; }
  .obs .camara .dentro > * { display: none; }
  .camara .rombo { position: absolute; width: 16px; height: 16px; background: var(--acento); transform: rotate(45deg); }

  .sello-logo { position: relative; width: 190px; height: 190px; display: flex; align-items: center; justify-content: center; flex: none; }
  .sello-logo svg { position: absolute; inset: 0; }
  .sello-logo img { position: relative; height: 64px; filter: drop-shadow(0 0 8px var(--acento)); }

  .cab { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .cab h1 { font-family: var(--f-tit); font-weight: 900; font-size: 50px; letter-spacing: calc(var(--esp) * .7); line-height: 1; }
  .cab .mes { font-style: italic; font-weight: 600; font-size: 30px; color: var(--acento); margin-top: -4px; }
  .separador { display: flex; align-items: center; gap: 14px; width: 100%; }
  .separador span { height: 1px; flex: 1; background: linear-gradient(90deg, transparent, var(--acento)); }
  .separador span:last-child { background: linear-gradient(90deg, var(--acento), transparent); }
  .separador i { width: 9px; height: 9px; background: var(--acento); transform: rotate(45deg); }
  .cuentas { display: flex; gap: 30px; font-family: var(--f-tit); font-size: 16px; letter-spacing: 3px; color: var(--suave); }
  .cuentas b { font-size: 26px; color: var(--crema); }

  /* Lista con desplazamiento infinito */
  .marco-lista { position: relative; width: 100%; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%); }
  .marco-lista.cabe { -webkit-mask-image: none; mask-image: none; }
  .pista { will-change: transform; }
  .sinmayus .lista { font-variant: normal; }
  .lista { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 26px; padding: 6px 0; font-weight: 600; font-size: 25px; line-height: 1.05; font-variant: small-caps; letter-spacing: 1px; text-align: center; }
  .lista div { overflow-wrap: anywhere; }
  .lista small { display: block; font-variant: normal; font-style: italic; font-size: 18px; color: var(--acento); }
  .vacio { grid-column: 1 / -1; font-style: italic; color: var(--tenue); font-variant: normal; }
  .cita { font-style: italic; font-size: 22px; color: var(--tenue); line-height: 1.3; text-align: center; white-space: pre-line; }

  .gracias b { display: block; font-family: var(--f-tit); font-weight: 900; font-size: 58px; line-height: 1; letter-spacing: 2px; text-shadow: 0 3px 18px #000; }
  .gracias i { display: block; font-weight: 600; font-size: 40px; color: var(--acento); text-shadow: 0 2px 12px #000; }
  .despedida { font-family: var(--f-tit); font-size: 18px; letter-spacing: 4px; color: var(--suave); }
  .comandos { display: flex; flex-wrap: wrap; gap: 14px; }
  .comandos span { padding: 8px 22px; border: 1px solid var(--acento); background: rgba(5,8,10,.7); font-family: var(--f-tit); font-weight: 700; font-size: 22px; letter-spacing: 2px; }

  /* ---------- Horizontal 1920x1080 ---------- */
  .h .titulo { left: 90px; top: 46px; width: 1180px; }
  .h .titulo .txt { font-size: 26px; }
  .h .sello { font-size: 22px; }
  .h .camara { left: 90px; top: 120px; width: 1180px; height: 664px; }
  .h .pie { position: absolute; left: 90px; top: 834px; width: 1180px; display: flex; align-items: center; gap: 44px; }
  .h .pie .linea { width: 1px; height: 110px; background: linear-gradient(180deg, transparent, var(--acento), transparent); }
  .h .pie .acc { display: flex; flex-direction: column; gap: 14px; flex: 1; min-width: 0; }
  .h .gracias { white-space: nowrap; flex: none; }
  .hc5.h .despedida { font-size: 16px; letter-spacing: 3px; }
  .h .panel { position: absolute; left: 1340px; top: 0; width: 580px; height: 1080px; padding: 50px 56px 46px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .h .panel .marco-lista { flex: 1; min-height: 0; }

  /* ---------- Vertical 1080x1920 (TikTok) ---------- */
  .v .titulo { left: 60px; right: 60px; top: 70px; flex-wrap: wrap; justify-content: center; gap: 14px 22px; }
  .v .titulo .txt { font-size: 30px; letter-spacing: 5px; width: 100%; text-align: center; }
  .v .titulo .corta, .v .titulo .raya { display: none; }
  .v .sello { font-size: 24px; }
  .v .camara { left: 60px; top: 210px; width: 960px; height: 560px; }
  .v .panel { position: absolute; left: 70px; right: 70px; top: 810px; height: 830px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .v .panel .sello-logo { position: absolute; left: -10px; top: -10px; width: 150px; height: 150px; }
  .v .panel .sello-logo img { height: 50px; }
  .v .cab h1 { font-size: 58px; }
  .v .lista { font-size: 30px; gap: 12px 30px; }
  .v .lista small { font-size: 21px; }
  .v .panel .marco-lista { flex: 1; min-height: 0; }
  .v .panel .cita { display: none; }
  .v .pie { position: absolute; left: 60px; right: 60px; top: 1680px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .v .pie .linea { display: none; }
  .v .pie .acc { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .v .gracias b { font-size: 60px; }
  .v .gracias i { font-size: 38px; }
  .v .despedida { font-size: 17px; letter-spacing: 3px; }

  /* ================= ESTILO HARDCORE T5 ================= */
  .hc5 { --acento: #ffc04d; --ember: #ff7a1a; --azul: #3da0ff; --azul-l: #9ccaff; --crema: #e9dcc0; --suave: #c9d6e8; }
  .hc5.h .velo { background: linear-gradient(90deg, rgba(4,6,12,.35) 0%, rgba(4,6,12,.15) 45%, rgba(4,6,12,.6) 68%, rgba(4,6,12,.75) 100%), radial-gradient(ellipse 90% 80% at 40% 45%, transparent 45%, rgba(0,0,0,.7) 100%); }
  .hc5.v .velo { background: linear-gradient(180deg, rgba(4,6,12,.55) 0%, rgba(4,6,12,.15) 22%, rgba(4,6,12,.7) 42%, rgba(4,6,12,.9) 100%); }
  .hc5 .camara { border: 0; padding: 18px; background: linear-gradient(135deg, rgba(255,255,255,.10), transparent 30%, rgba(0,0,0,.4)), repeating-linear-gradient(90deg, #232630 0 38px, #15171d 38px 40px, #2b2f3a 40px 78px, #121419 78px 80px); animation: hcGlow 5s ease-in-out infinite; }
  .hc5 .camara .dentro { border: 0; box-shadow: 0 0 0 3px #07080b, inset 0 0 22px rgba(0,0,0,.45); }
  .hc5 .camara .rombo { display: none; }
  .hc5 .camara .grieta { display: block; }
  .grieta { display: none; position: absolute; pointer-events: none; overflow: visible; }
  @keyframes hcGlow { 0%,100% { box-shadow: 0 0 22px 2px rgba(61,160,255,.45), 0 14px 30px rgba(255,120,30,.45); } 50% { box-shadow: 0 0 38px 6px rgba(61,160,255,.8), 0 14px 44px rgba(255,140,40,.8); } }
  .quieto.hc5 .camara { animation: none; }
  .hc5 .titulo .txt { padding: 8px 28px 6px; background: linear-gradient(180deg, #4a3623, #2a1d12); border: 3px solid #120b06; font-weight: 900; color: var(--crema); text-shadow: 0 2px 0 #000, 0 0 14px rgba(255,160,60,.35); clip-path: polygon(0 0, 100% 4%, 98% 100%, 2% 96%); transform: rotate(-1.2deg); box-shadow: 0 6px 18px rgba(0,0,0,.6); }
  .hc5.v .titulo .txt { width: auto; }
  .hc5 .titulo .corta { background: var(--azul); }
  .hc5 .titulo .raya { background: linear-gradient(90deg, var(--azul), transparent); }
  .hc5 .sello { border: 2px solid rgba(61,160,255,.55); background: linear-gradient(180deg, rgba(18,20,28,.92), rgba(8,9,13,.92)); color: var(--acento); text-shadow: 0 0 16px rgba(255,120,30,.8); box-shadow: 0 0 22px rgba(61,160,255,.35), inset 0 0 14px rgba(0,0,0,.8); clip-path: polygon(0 8%, 4% 0, 100% 0, 100% 90%, 96% 100%, 0 100%); font-family: var(--f-tit); font-weight: 900; }
  .hc5.h .panel { background: linear-gradient(180deg, rgba(10,12,18,.86), rgba(6,7,11,.94)); border-left: 2px solid rgba(61,160,255,.45); box-shadow: -10px 0 40px rgba(61,160,255,.18); }
  .hc5 .cab h1 { color: var(--crema); text-shadow: 0 0 18px rgba(61,160,255,.55), 0 2px 0 #000; }
  .hc5 .cab .mes { font-style: normal; font-weight: 500; font-size: 22px; letter-spacing: 5px; text-transform: uppercase; color: var(--azul-l); margin-top: 0; }
  .hc5 .separador span { background: linear-gradient(90deg, transparent, var(--ember)); }
  .hc5 .separador span:last-child { background: linear-gradient(90deg, var(--ember), transparent); }
  .hc5 .separador i { background: var(--ember); box-shadow: 0 0 10px var(--ember); }
  .hc5 .cuentas { font-family: var(--f-txt); letter-spacing: 4px; color: #8fb8e8; }
  .hc5 .cuentas b { font-family: var(--f-tit); color: var(--acento); text-shadow: 0 0 14px rgba(255,120,30,.8); }
  .hc5 .lista { font-variant: normal; text-transform: uppercase; font-weight: 500; font-size: 23px; letter-spacing: 1.5px; line-height: 1.1; }
  .hc5.v .lista { font-size: 28px; }
  .hc5 .lista small { font-style: normal; font-size: 15px; letter-spacing: 1px; color: var(--azul-l); text-transform: none; }
  .hc5 .cita { font-style: normal; text-transform: uppercase; font-size: 16px; letter-spacing: 3px; color: #8fb8e8; }
  .hc5 .gracias b { color: var(--crema); text-shadow: 0 2px 0 #000, 0 0 22px rgba(255,140,40,.55); }
  .hc5 .gracias i { font-style: normal; font-weight: 500; text-transform: uppercase; letter-spacing: 4px; font-size: 30px; color: var(--azul-l); text-shadow: 0 0 14px rgba(61,160,255,.6); }
  .hc5 .despedida { font-family: var(--f-txt); letter-spacing: 5px; color: #8fb8e8; }
  .hc5 .comandos span { border: 0; border-left: 6px solid var(--ember); border-top: 2px solid rgba(61,160,255,.55); background: linear-gradient(180deg, rgba(18,20,28,.95), rgba(8,9,13,.95)); font-family: var(--f-txt); color: var(--acento); text-shadow: 0 0 12px rgba(255,120,30,.55); letter-spacing: 2px; clip-path: polygon(0 0, 100% 0, 93% 100%, 0 100%); padding-right: 30px; box-shadow: 0 0 22px rgba(61,160,255,.3); }
  .hc5 .sello-logo img { filter: drop-shadow(0 0 8px var(--ember)); }
  canvas.brasas { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }

  /* Patrocinadores de la serie */
  .patro { width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid var(--acento); background: rgba(5,8,10,.55); text-align: center; }
  .patro .et { font-family: var(--f-tit); font-weight: 700; font-size: 15px; letter-spacing: 5px; color: var(--acento); }
  .patro .filas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
  .patro .filas.uno { grid-template-columns: 1fr; }
  .patro b { display: block; font-family: var(--f-tit); font-weight: 700; font-size: 24px; letter-spacing: 1px; color: var(--crema); overflow-wrap: anywhere; }
  .patro small { display: block; font-size: 16px; color: var(--suave); line-height: 1.2; }
  .v .patro b { font-size: 28px; } .v .patro small { font-size: 19px; }
  .hc5 .patro { border: 2px solid rgba(61,160,255,.55); border-left: 6px solid var(--ember); background: linear-gradient(180deg, rgba(18,20,28,.92), rgba(8,9,13,.92)); box-shadow: 0 0 22px rgba(61,160,255,.3); }
  .hc5 .patro b { color: var(--acento); text-shadow: 0 0 12px rgba(255,120,30,.55); }
  .hc5 .patro small { color: var(--azul-l); text-transform: uppercase; letter-spacing: 1.5px; font-size: 14px; }

  .aviso { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 8px 16px; background: rgba(120,20,20,.85); font: 16px sans-serif; border-radius: 6px; }
</style>
</head>
<body>
<div class="escena" id="escena"></div>

<script src="datos.js"></script>
<script>
const P = new URLSearchParams(location.search);
const VERTICAL = P.get('formato') === 'vertical';
const DEMO = P.get('demo') === '1';
const OBS = P.get('obs') !== '0' && !P.has('maqueta'); // en OBS el hueco de cámara es transparente
const VELOCIDAD = +(P.get('velocidad') || 28);          // píxeles por segundo al desplazarse

// Barrera mágica: posición sobre la imagen del faro (fracciones de la imagen)
const EFECTOS = { barrera: { cx: 0.547, cy: 0.446, r: 0.281 } };

const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function serieActual() {
  const c = TV.config();
  const id = P.get('serie') && c.series[P.get('serie')] ? P.get('serie') : c.activa;
  return c.series[id] || Object.values(c.series)[0];
}
function mesMostrado() {
  if (P.get('mes')) return P.get('mes');
  const d = new Date();
  if (P.get('anterior')) d.setMonth(d.getMonth() - 1);
  return TV.claveMes(d);
}

function svgSello() {
  return `<svg viewBox="0 0 150 150" fill="none" stroke="var(--acento)" stroke-width="1.2" aria-hidden="true">
    <circle cx="75" cy="75" r="72"/><circle cx="75" cy="75" r="62" stroke-dasharray="2 5"/><circle cx="75" cy="75" r="48"/>
    <path d="M75 3 L137 111 L13 111 Z"/><path d="M75 147 L13 39 L137 39 Z"/></svg>`;
}

function htmlBarrera(W, H) {
  // Calcula dónde cae la barrera de la imagen con object-fit: cover
  const e = EFECTOS.barrera, iw = 1920, ih = 1080;
  const k = Math.max(W / iw, H / ih), ox = (W - iw * k) / 2, oy = (H - ih * k) / 2;
  const cx = ox + e.cx * iw * k, cy = oy + e.cy * ih * k, R = e.r * iw * k;
  let chispas = '';
  for (let i = 0; i < 22; i++) {
    const r = (n) => { const x = Math.sin(i * 97.13 + n * 13.7) * 1e4; return x - Math.floor(x); };
    chispas += `<div class="chispa" style="left:${(15 + r(1) * 70).toFixed(1)}%;top:${(52 + r(2) * 40).toFixed(1)}%;width:${(3 + r(3) * 5).toFixed(0)}px;height:${(3 + r(3) * 5).toFixed(0)}px;animation-duration:${(6 + r(4) * 6).toFixed(1)}s;animation-delay:${(-r(5) * 12).toFixed(1)}s"></div>`;
  }
  return `<div class="barrera" style="left:${cx - R}px;top:${cy - R}px;width:${2 * R}px;height:${2 * R}px">
    <div class="brillo"></div>
    <div class="gira"><svg viewBox="0 0 1080 1080" fill="none" stroke="#ffe39a" aria-hidden="true">
      <circle cx="540" cy="540" r="532" stroke-width="2" stroke-dasharray="4 14" opacity=".9"/>
      <circle cx="540" cy="540" r="505" stroke-width="1" stroke-dasharray="120 30 10 30" opacity=".7"/>
      <path d="M540 40 L973 790 L107 790 Z" stroke-width="1.2" opacity=".45"/></svg></div>
    <div class="giraR"><svg viewBox="0 0 1080 1080" fill="none" stroke="#fff1c4" aria-hidden="true">
      <circle cx="540" cy="540" r="470" stroke-width="1.5" stroke-dasharray="2 10 40 10" opacity=".6"/>
      <path d="M540 1040 L107 290 L973 290 Z" stroke-width="1.2" opacity=".4"/>
      <circle cx="540" cy="70" r="26" stroke-width="1.5" opacity=".8"/><circle cx="540" cy="1010" r="26" stroke-width="1.5" opacity=".8"/>
      <circle cx="70" cy="540" r="18" stroke-width="1.5" opacity=".8"/><circle cx="1010" cy="540" r="18" stroke-width="1.5" opacity=".8"/></svg></div>
    ${chispas}</div>`;
}

function htmlPatro(s) {
  const ps = (s.patrocinadores || []).filter((p) => p && p.nombre);
  if (!ps.length) return '';
  return `<div class="patro"><div class="et">${esc(s.patroTitulo || 'PATROCINADORES')}</div>
    <div class="filas ${ps.length === 1 ? 'uno' : ''}">${ps.map((p) => `<div><b>${esc(p.nombre)}</b>${p.detalle ? `<small>${esc(p.detalle)}</small>` : ''}</div>`).join('')}</div></div>`;
}

function htmlNombres(lista) {
  if (!lista.length) return '<div class="vacio">Aún no hay colaboradores este mes</div>';
  return lista.map((e) => `<div>${esc(e.nombre)}${e.regaloDe ? `<small>regalo de ${esc(e.regaloDe)}</small>` : ''}</div>`).join('');
}

let animLista = null;
function pintar() {
  const s = serieActual();
  const mes = mesMostrado();
  const datos = DEMO ? TV.demo() : TV.listaVisible(mes);
  const W = VERTICAL ? 1080 : 1920, H = VERTICAL ? 1920 : 1080;
  const el = document.getElementById('escena');
  el.className = `escena ${VERTICAL ? 'v' : 'h'} ${OBS ? 'obs' : ''} ${P.get('animacion') === '0' ? 'quieto' : ''} ${s.estilo === 'hc5' ? 'hc5' : ''}`;
  el.style.setProperty('--acento', s.acento || '#e8c56b');
  const t = TV.TEMAS[s.tema] || TV.TEMAS.epica;
  const urlF = `https://fonts.googleapis.com/css2?family=${t.google}&display=swap`;
  if (document.getElementById('fuentes').getAttribute('href') !== urlF) document.getElementById('fuentes').setAttribute('href', urlF);
  el.style.setProperty('--f-tit', t.titulo);
  el.style.setProperty('--f-txt', t.texto);
  el.style.setProperty('--esp', t.espaciado + 'px');
  if (!t.mayus) el.classList.add('sinmayus');

  const comandos = (s.comandos || []).filter(Boolean).map((c) => `<span>${esc(c)}</span>`).join('');
  el.innerHTML = `
    ${s.video ? `<video class="fondo" src="${esc(s.video)}" poster="${esc(s.fondo)}" autoplay muted loop playsinline></video>` : `<img class="fondo" src="${esc(s.fondo)}" alt="">`}
    ${s.efecto === 'barrera' ? htmlBarrera(W, H) : ''}
    ${s.efecto === 'brasas' ? `<canvas class="brasas" id="brasas" width="${W}" height="${H}"></canvas>` : ''}
    <div class="velo"></div>
    <div class="titulo"><div class="corta"></div><div class="txt">${esc(s.titulo)}</div><div class="raya"></div>${s.horas ? `<div class="sello">${esc(s.horas)}</div>` : ''}</div>
    <div class="camara"><div class="dentro"><b>CÁMARA</b><i>en OBS va encima de este marco</i></div>
      <div class="rombo" style="left:-9px;top:-9px"></div><div class="rombo" style="right:-9px;top:-9px"></div>
      <div class="rombo" style="left:-9px;bottom:-9px"></div><div class="rombo" style="right:-9px;bottom:-9px"></div>
      <svg class="grieta" style="inset:0;width:100%;height:100%" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="#ff7a1a" stroke-width="0.35" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 4px #ff7a1a)"><polyline points="0.6,18 2,22 1.2,27 2.6,32" vector-effect="non-scaling-stroke" stroke-width="1.6"/><polyline points="99.4,70 98,75 99,80 97.6,86" vector-effect="non-scaling-stroke" stroke-width="1.6"/><polyline points="28,0.8 30,2.6 29,4" vector-effect="non-scaling-stroke" stroke-width="1.6"/><polyline points="64,99.2 66,97.4 65,96" vector-effect="non-scaling-stroke" stroke-width="1.6"/></g></svg></div>
    <div class="pie">
      <div class="gracias"><b>${esc(s.gracias1)}</b><i>${esc(s.gracias2)}</i></div>
      <div class="linea"></div>
      <div class="acc"><div class="despedida">${esc(s.despedida)}</div><div class="comandos">${comandos}</div></div>
    </div>
    <div class="panel">
      <div class="sello-logo">${svgSello()}<img src="img/logo.png" alt="TrikiVals"></div>
      <div class="cab">
        <h1>${esc(s.colaboradores || 'COLABORADORES')}</h1>
        <div class="mes">${esc(s.subtitulo)} ${TV.nombreMes(mes)}</div>
        <div class="separador"><span></span><i></i><span></span></div>
        <div class="cuentas"><div><b>${datos.total}</b> SUBS</div><div><b>${datos.regaladas}</b> REGALADAS</div></div>
      </div>
      ${htmlPatro(s)}
      <div class="marco-lista" id="marco"><div class="pista" id="pista"><div class="lista">${htmlNombres(datos.lista)}</div></div></div>
      <div class="cita">${esc(s.cita)}</div>
    </div>
    ${!DEMO && !TV.token() ? '<div class="aviso">Sin conexión con Twitch: conéctate desde el panel</div>' : ''}`;

  escalar();
  if (s.efecto === 'brasas') brasas(W, H);
  requestAnimationFrame(() => requestAnimationFrame(desplazar));
}

// Brasas que suben desde abajo (como en el overlay del Hardcore 5)
let brasasId = 0;
function brasas(W, H) {
  const cv = document.getElementById('brasas'); if (!cv) return;
  const ctx = cv.getContext('2d'), id = ++brasasId, quieto = P.get('animacion') === '0';
  const nueva = (ini) => { const life = 2.5 + Math.random() * 3; return { x: Math.random() * W, y: H - 40 + Math.random() * 60, vx: (Math.random() - .5) * 18, vy: -(45 + Math.random() * 60), r: 1 + Math.random() * 2.6, t: ini ? Math.random() * life : 0, life }; };
  const ps = Array.from({ length: VERTICAL ? 60 : 70 }, () => nueva(true));
  let ultimo = performance.now();
  (function bucle(ahora) {
    if (id !== brasasId) return;
    const dt = Math.min(.05, (ahora - ultimo) / 1000); ultimo = ahora;
    ctx.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.t += dt; if (p.t > p.life) { Object.assign(p, nueva(false)); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      const a = Math.sin(Math.PI * p.t / p.life);
      ctx.fillStyle = `rgba(255,150,50,${a * .85})`; ctx.shadowColor = 'rgba(255,120,20,.9)'; ctx.shadowBlur = 9;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill();
    }
    if (!quieto) requestAnimationFrame(bucle);
  })(ultimo);
}

// Si los nombres no caben, la lista sube despacio en bucle infinito
function desplazar() {
  if (animLista) { animLista.cancel(); animLista = null; }
  const marco = document.getElementById('marco'), pista = document.getElementById('pista');
  const lista = pista.firstElementChild;
  const alto = lista.offsetHeight;
  if (alto <= marco.clientHeight) { marco.classList.add('cabe'); return; }
  const hueco = 60;
  lista.style.marginBottom = hueco + 'px';
  pista.appendChild(lista.cloneNode(true));
  const recorrido = alto + hueco;
  animLista = pista.animate([{ transform: 'translateY(0)' }, { transform: `translateY(-${recorrido}px)` }],
    { duration: (recorrido / VELOCIDAD) * 1000, iterations: Infinity, easing: 'linear' });
}

function escalar() {
  const el = document.getElementById('escena');
  const W = VERTICAL ? 1080 : 1920, H = VERTICAL ? 1920 : 1080;
  const k = Math.min(innerWidth / W, innerHeight / H);
  el.style.transform = `translate(${(innerWidth - W * k) / 2}px, ${(innerHeight - H * k) / 2}px) scale(${k})`;
}
addEventListener('resize', escalar);

// Cambios hechos en el panel se ven al instante
addEventListener('storage', (e) => { if (e.key && e.key.startsWith('tv_')) pintar(); });

pintar();
if (document.fonts) document.fonts.addEventListener('loadingdone', () => desplazar());
if (!DEMO) {
  const sync = () => TV.sincronizar().then((r) => r.ok && pintar()).catch((e) => console.warn(e.message));
  sync();
  setInterval(sync, 10 * 60 * 1000);
}
</script>
